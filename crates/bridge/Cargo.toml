[package]
name = "synthlm-bridge"
version = "0.0.0"
edition.workspace = true

# TSK-114: `cdylib` so REAPER can load the extension entry
# (`crates/bridge/src/extension.rs`); `rlib` retained for unit tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
synthlm-common = { path = "../common" }
# TSK-101: reaper-rs via git (per its README crates.io copies are stale).
# master HEAD pinned to exact rev 2026-10-06; medium primary, low fallback (A01 §6 gaps).
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs.git", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }
reaper-low = { git = "https://github.com/helgoboss/reaper-rs.git", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# TSK-502: bridge IPC client packs snapshot/undo output into wire frames.
# Same pinned version already in the workspace lockfile via synthlm-common
# and registered in docs/LICENSES.md (MIT OR Apache-2.0); no new external
# crate is introduced by this line.
serde_json = "1"

[dev-dependencies]
