[package]
name = "synthlm-dsp"
version = "0.0.0"
edition.workspace = true

[dependencies]
synthlm-common = { path = "../common" }
# TSK-205 (stem queue + content-addressed cache + GC): queue/cache layer only.
# Demucs inference itself is NOT wired here (see src/demucs.rs stub).
# Licenses: all permissive (MIT/Apache-2.0); already in workspace lockfile,
# so no new external dependency. Registration left to docs/LICENSES.md owner.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
