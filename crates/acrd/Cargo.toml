[package]
name = "synthlm-acrd"
version = "0.0.0"
edition.workspace = true

[[bin]]
name = "acrd"
path = "src/main.rs"

[lib]
name = "synthlm_acrd"
path = "src/lib.rs"

[dependencies]
synthlm-common = { path = "../common" }
synthlm-profile = { path = "../profile" }
synthlm-planner = { path = "../planner" }
synthlm-retrieval = { path = "../retrieval" }
synthlm-eval = { path = "../eval" }
# TSK-801 wire 1: the daemon now exposes the stem/artifact cache (status + GC)
# instead of leaving `synthlm-dsp` an orphan crate. Workspace-internal path
# dependency; no new external crate is introduced by this line.
synthlm-dsp = { path = "../dsp" }
# TSK-405 demo harness only: JSON plan artifact. Already in the workspace
# lockfile and registered in docs/LICENSES.md (MIT OR Apache-2.0); no new
# external crate is introduced by this line.
serde_json = "1.0.151"
# TSK-501 daemon accept loop needs the Listener/Stream types. Same pinned
# version already in the workspace lockfile via synthlm-common and registered
# in docs/LICENSES.md (0BSD OR Apache-2.0); no new external crate is
# introduced by this line.
interprocess = "2.4.4"
ctrlc = "3"

[dev-dependencies]
# TSK-502 round-trip tests drive bridge frame builders against the dispatcher
# over loopback. rlib use of the workspace bridge crate; no new external
# crate is introduced by this line.
synthlm-bridge = { path = "../bridge" }
