[package]
name = "synthlm-eval"
version = "0.0.0"
edition.workspace = true

[features]
# TSK-601 CLAP ONNX seam: opt-in only. Enabling `onnx` pulls the prebuilt
# ONNX Runtime binaries at build time (ort `download-binaries`) and opens the
# pinned local weight cache; the default build stays offline and dependency-
# free beyond the MIR core. License row in docs/LICENSES.md.
onnx = ["dep:ort"]

[dependencies]
synthlm-common = { path = "../common" }
# TSK-202 (MIR v1): STFT via realfft/rustfft, LUFS via ebur128, errors via thiserror.
# Licenses registered in docs/LICENSES.md (AGENTS.md red line 6): all permissive.
thiserror = "2"
realfft = "3.5"
rustfft = "6.4"
ebur128 = "0.1"
# TSK-601 (CLAP ONNX seam, `onnx` feature only): safe ONNX Runtime wrapper.
# MIT OR Apache-2.0, https://github.com/pykeio/ort (docs.rs 2.0.0-rc.13
# verified 2026-10-07). Default features keep `download-binaries` so a
# feature-enabled build links without a system ORT install; `ort` internals
# contain FFI unsafe, this crate adds none (boundary noted in src/clap.rs).
ort = { version = "2.0.0-rc.13", optional = true }

[dev-dependencies]
# TSK-206 decode-matrix spike only (integration test `tests/decode_matrix.rs`).
# symphonia 0.6.1, MPL-2.0, https://github.com/pdeljanov/Symphonia
# (https://crates.io/crates/symphonia/0.6.1, MSRV 1.85). License-row
# registration in docs/LICENSES.md intentionally left to TSK-113's owner
# per TSK-206 scope (do not edit that file here); registration text ships
# in the TSK-206 return message. Defaults cover wav/flac/vorbis/ogg/pcm;
# mp3 + aac + isomp4 extend the matrix to mp3/vorbis/aac.
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }
# TSK-208 loudness cross-validation only (integration test
# `tests/loudness_xcheck.rs`): independent BS.1770-4 implementation used to
# check `ebur128` integrated LUFS within +/-0.5 LU on synthetic signals.
# ebur128-stream 0.2.0, MIT OR Apache-2.0,
# https://github.com/vanjamodrinjak21/ebur128-stream
# (https://crates.io/crates/ebur128-stream/0.2.0, MSRV 1.85, pure Rust,
# `#![forbid(unsafe_code)]`). License-row registration in docs/LICENSES.md
# intentionally left to its owner per TSK-208 scope (do not edit that file
# here); registration text ships in the TSK-208 return message.
ebur128-stream = "0.2"
