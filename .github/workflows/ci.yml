name: ci

on:
  push:
  pull_request:

jobs:
  lint-test-doc:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      # Pinned for reproducibility (matches dev machines); bumps are
      # deliberate tasks that must re-run the full gate on all three OS.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo doc --workspace --no-deps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-docs.py
      # Contract gates added 2026-10-07 (TSK-802/803) after the workspace
      # assessment found DEC-022 was never enforced by CI and that doc counts
      # could drift undetected (M57 claimed 63 Done while the index held 64).
      - run: python scripts/check-deps.py
      - run: python scripts/check-contract.py
