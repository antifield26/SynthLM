name: ci

on:
  push:
  pull_request:

jobs:
  lint-test-doc:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      # Pinned for reproducibility (matches dev machines); bumps are
      # deliberate tasks that must re-run the full gate on all three OS.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo doc --workspace --no-deps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-docs.py
      # Contract gates added 2026-10-07 (TSK-802/803) after the workspace
      # assessment found DEC-022 was never enforced by CI and that doc counts
      # could drift undetected (M57 claimed 63 Done while the index held 64).
      - run: python scripts/check-deps.py
      - run: python scripts/check-contract.py
      # Proves the two gates above can actually fail (plants one violation per
      # check, asserts non-zero, restores the worktree).
      - run: python scripts/selftest-gates.py
      # Real-technology visibility gate (TSK-808): FFmpeg CLI, the real
      # lancedb crate, ONNX CLAP and Demucs ONNX. SKIPPED is expected on this
      # runner until weights/protoc (and the ORT binaries) are provisioned —
      # the step reports those skips instead of tolerating them silently, and
      # fails only on a real test failure.
      - name: real-technology visibility gate
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/test-realtech.py
